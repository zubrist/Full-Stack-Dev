<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        button.myBtn {
            background-color: transparent;
            color: rgb(108, 106, 242);
            padding: 7px 7px;
            border: 0.5px solid rgb(108, 106, 242);
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }
        button.myBtn:hover {
            background-color: rgb(108, 106, 242);
            color: white;
        }

    </style>
</head>
<body>
    
<h2 > I am a Bootstrap Text</h2>

<h3>
  Fancy display heading
  <small class="text-body-secondary">With faded secondary text</small>
</h3>

<button type="button" class="btn btn-danger">Primary</button>
<br><br>
<button type="button" class="btn btn-outline-primary">Primary</button>
<br><br>
<button class="myBtn">My Button</button>

<br><br>
<button type="button" class="btn btn-primary btn-lg">Large button</button>
<button type="button" class="btn btn-secondary btn-sm">Small button</button>


<br> <br>
<div class="container-sm border border-danger p-4 text-center">
  I am a div inside a container
</div><br>

</div>

 </div>
